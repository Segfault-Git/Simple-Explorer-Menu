name: 'Release'

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    name: 'Release'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 'Semantic Release (main only)'
        if: github.ref_name == 'main'
        uses: cycjimmy/semantic-release-action@v6
        id: semantic
        with:
          semantic_version: 25.0.9
          branch: main
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/exec@7.1.0
            @semantic-release/changelog@7.0.0
            conventional-changelog-conventionalcommits@10.4.0

      - name: 'Delete old pre-release'
        if: github.ref_name == 'dev'
        run: |
          if gh release view pre >/dev/null 2>&1; then
            echo "Deleting old pre-release: pre"
            gh release delete pre --yes --cleanup-tag
          fi

      - name: 'Create ZIP archive'
        run: |
          zip -r SEM.zip . -x ".git/*" ".gitignore" ".github/*" ".releaserc.json" "sem.ps1"

      - name: 'Inject version into sem.ps1 (main)'
        if: github.ref_name == 'main' && steps.semantic.outputs.new_release_published == 'true'
        run: |
          sed -i "s/Version : .*/Version : ${{ steps.semantic.outputs.new_release_version }}/" sem.ps1
          sed -i 's/\$semVersion = "0.0.0"/$semVersion = "${{ steps.semantic.outputs.new_release_version }}"/' sem.ps1
          sed -i 's/\$semReleaseTag = "pre"/$semReleaseTag = ""/' sem.ps1

      - name: 'Inject tag into sem.ps1 (dev)'
        if: github.ref_name == 'dev'
        run: |
          sed -i 's/\$semReleaseTag = ""/$semReleaseTag = "pre"/' sem.ps1

      - name: 'Upload release assets (main)'
        if: github.ref_name == 'main' && steps.semantic.outputs.new_release_published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semantic.outputs.new_release_version }}
          files: |
            SEM.zip
            sem.ps1
          append_body: true

      - name: 'Upload release assets (dev)'
        if: github.ref_name == 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre
          prerelease: true
          files: |
            SEM.zip
            sem.ps1
